name: intercom

services:
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intercom}
      POSTGRES_USER: ${POSTGRES_USER:-intercom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intercom}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intercom} -d ${POSTGRES_DB:-intercom}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: &json-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ./server
    image: intercom-server:${IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./server/.env
    restart: "no"
    logging: *json-logs

  api:
    build:
      context: ./server
    image: intercom-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./server/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *json-logs

  web:
    build:
      context: ./client
      args:
        API_ORIGIN: http://api:8000
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
    image: intercom-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *json-logs

volumes:
  db-data:
